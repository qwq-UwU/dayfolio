<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>序日 · 日程规划</title><link rel="stylesheet" href="style.css"><body><aside><header><b class="logo">▤</b><strong>序日</strong><small>DAYFOLIO</small></header><button id="newTask" class="primary">＋　新建任务</button><nav><button id="calendar">▦　 日历视图</button><button id="tasks">☷　 任务总览</button></nav><section><label>我的列表<button id="addList" aria-label="添加列表">＋</button></label><div id="lists"></div></section><section><label><span id="tagHeading">任务分类</span><button id="newCategory" aria-label="新建分类">＋</button></label><div id="taskTags" role="group" aria-labelledby="tagHeading"></div></section><footer><b>序</b> 个人工作区</footer></aside><main><div class="crumb">个人工作区　 /　 <span id="where"></span></div><div class="heading"><div><small>PLANNER</small><h1 id="title"></h1></div><span class="status">●　 本地工作区</span></div><div class="toolbar"><h2 id="month"></h2><button id="prev" aria-label="上个月">‹</button><button id="next" aria-label="下个月">›</button><button id="today">今天</button><div id="periods" class="periods" aria-label="日历视图"><button data-period="day">日</button><button data-period="threeDays">三日</button><button data-period="week">周</button><button data-period="month">月</button></div><button id="reset" hidden>清除筛选 ×</button></div><div id="view"></div></main><dialog id="editor"><form id="form"><h2>任务详情</h2><label>任务名称<input id="nameField" required maxlength="100" autofocus></label><label>计划日期<input type="date" id="dateField" required></label><label><input type="checkbox" id="allDay"> 全天</label><div id="times"><label>开始时间<input type="time" id="startTime" step="60" required></label><label>结束时间 <span id="nextDay" hidden>（次日）</span><input type="time" id="endTime" step="60" required></label></div><label>所属列表<select id="listField"></select></label><div class="category-field"><label>分类<select id="catField"></select></label><button type="button" id="addCat" aria-label="添加分类">＋</button></div><label><input id="done" type="checkbox"> 已完成</label><div class="actions"><button type="button" id="del">删除</button><button type="button" id="cancel">取消</button><button class="primary">保存</button></div></form></dialog><dialog id="categoryEditor" aria-labelledby="categoryTitle">
 <form id="categoryForm">
  <h2 id="categoryTitle">新建分类</h2>
  <label>分类名称<input id="categoryName" required autofocus></label>
  <label>标签颜色<input id="categoryColor" type="color"></label>
  <div class="actions"><button id="categoryCancel" type="button">取消</button><button class="primary">保存</button></div>
 </form>
</dialog><script src="app.js"></script></body></html>
